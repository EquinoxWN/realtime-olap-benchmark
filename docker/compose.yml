# The three server engines, one profile each. The benchmark starts one profile at a time on the
# same machine (scripts/bench_servers.sh), so the engines never compete for CPU or memory.
# Images are pinned by digest; ports are bound to 127.0.0.1 except Doris, which needs host
# networking (its BE registers with the FE by address, as in the Doris quick start for Linux).
# Linux only (host networking); used by the CI `engines` job.
name: olapbench

services:
  clickhouse:
    profiles: [clickhouse]
    # 26.3 is a long-term-support line
    image: clickhouse/clickhouse-server:26.3.60.2@sha256:3cbe484d8571988bae07dfe98bb0f62778a5ad8225745be9366acf5f1debd9e8
    environment:
      CLICKHOUSE_USER: bench
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user bench --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  doris-fe:
    profiles: [doris]
    image: apache/doris:fe-4.1.3@sha256:3dd47644cd9fa8152028bdae449e77170ab0de004bd7a3fa311a204a106c26c7
    hostname: fe
    environment:
      FE_SERVERS: fe1:127.0.0.1:9010
      FE_ID: "1"
    network_mode: host
    # The image's fe.conf sets an 8 GB heap, more than the container may use (CI saw OOM kills at
    # 3 GB and 8 GB limits); cap the heap at 4 GB, then run the image's own entrypoint.
    entrypoint:
      - bash
      - -c
      - >-
        sed -i 's/-Xmx8192m -Xms8192m/-Xmx4096m -Xms1024m/' /opt/apache-doris/fe/conf/fe.conf &&
        grep -o -- '-Xmx[0-9]*m' /opt/apache-doris/fe/conf/fe.conf &&
        exec bash init_fe.sh
    mem_limit: 6g

  doris-be:
    profiles: [doris]
    image: apache/doris:be-4.1.3@sha256:9f84a8b018069cd3c9a65af42ff5ef2c733b3b25e1ca708e0a3e4078361a1eb3
    hostname: be
    environment:
      FE_SERVERS: fe1:127.0.0.1:9010
      BE_ADDR: 127.0.0.1:9050
    depends_on: [doris-fe]
    network_mode: host
    mem_limit: 6g

  starrocks:
    profiles: [starrocks]
    image: starrocks/allin1-ubuntu:4.1.6@sha256:5cbf09c4c788d2ca41a8e38599b650f04dbc6af0de51ebda0952770fb8333e5d
    ports:
      - "127.0.0.1:9030:9030"
      - "127.0.0.1:8030:8030"
      - "127.0.0.1:8040:8040"
    mem_limit: 9g
